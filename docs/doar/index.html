<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doar por Pix</title>
<link rel="icon" href="../favicon.ico">
<meta name="robots" content="noindex">
<style>
:root { color-scheme: dark; --bg:#0b0c0e; --card:#16181c; --line:#2a2d33; --text:#e8e9ec; --muted:#9a9ea8; --accent:#7c5cff; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:16px/1.6 "Segoe UI", system-ui, sans-serif; padding:16px; box-sizing:border-box; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px; max-width:420px; text-align:center; }
.muted { color:var(--muted); font-size:14px; }
a { color:#a48bff; }
</style>
</head>
<body>
<div class="card">
	<h1 style="font-size:22px;margin:0 0 8px">Doar por Pix</h1>
	<p id="status" class="muted">Abrindo a página de doação...</p>
	<p class="muted"><a href="../">MultStreamLab</a></p>
</div>
<script>
// O servidor de doações roda no PC do streamer, atrás de um túnel cujo endereço muda a cada vez que
// ele liga. Com ?c=<id>, o app do streamer publica o endereço atual no canal msl-<id> do ntfy.sh,
// assinado com a chave dele: aqui só vale a publicação mais nova com assinatura válida, e o id é o
// resumo da chave pública (ninguém publica no lugar dele). Sem ?c, vale o doar.json do site.
const status = document.getElementById("status");
const offline = () => (status.textContent = "As doações estão desligadas agora. Tente de novo durante a live.");

async function open(url) {
	if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/d\/[a-z0-9-]+$/.test(url)) return offline();
	const controller = new AbortController();
	setTimeout(() => controller.abort(), 6000);
	const base = url.slice(0, url.indexOf("/d/"));
	const alive = await fetch(base + "/saude", { cache: "no-store", signal: controller.signal }).then((r) => r.ok).catch(() => false);
	if (!alive) return offline();
	location.replace(url);
}

const bytes = (text) => Uint8Array.from(atob(text.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
const urlSafe = (data) => btoa(String.fromCharCode(...new Uint8Array(data))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

async function verified(line, id) {
	const event = JSON.parse(line);
	if (event.event !== "message") return null;
	const { p, d, s } = JSON.parse(event.message);
	const pub = bytes(p);
	if (pub.length !== 64) return null;
	const digest = await crypto.subtle.digest("SHA-256", pub);
	if (urlSafe(digest.slice(0, 16)) !== id) return null;
	const raw = new Uint8Array(65);
	raw[0] = 4;
	raw.set(pub, 1);
	const key = await crypto.subtle.importKey("raw", raw, { name: "ECDSA", namedCurve: "P-256" }, false, ["verify"]);
	const ok = await crypto.subtle.verify({ name: "ECDSA", hash: "SHA-256" }, key, bytes(s), new TextEncoder().encode(d));
	return ok ? JSON.parse(d) : null;
}

async function fromChannel(id) {
	const response = await fetch(`https://ntfy.sh/msl-${id}/json?poll=1&since=12h`, { cache: "no-store" });
	let newest = null;
	for (const line of (await response.text()).split("\n")) {
		if (!line.trim()) continue;
		const data = await verified(line, id).catch(() => null);
		if (data && (!newest || data.t > newest.t)) newest = data;
	}
	return newest && newest.u ? open(newest.u) : offline();
}

const id = new URLSearchParams(location.search).get("c");
if (id && /^[A-Za-z0-9_-]{22}$/.test(id)) {
	fromChannel(id).catch(offline);
} else {
	fetch("../doar.json?t=" + Date.now(), { cache: "no-store" })
		.then((response) => response.json())
		.then((target) => (target.url && target.alias ? open(target.url + "/d/" + encodeURIComponent(target.alias)) : offline()))
		.catch(offline);
}
</script>
</body>
</html>
